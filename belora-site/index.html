<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Convivia – Sorties, amitiés & rencontres 50+</title>
  <meta name="description" content="Convivia : des sorties près de chez vous, des amitiés et des rencontres bienveillantes pour les 50 ans et plus.">
  <meta name="theme-color" content="#1F3A5F">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Convivia">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="pwa/favicon-32.png">
  <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="assets/convivia-logo-vertical-fond-sombre.svg" alt=""></div>
  <div id="offline" role="status" hidden>Vous êtes hors connexion. L'application reste utilisable.</div>
  <div class="demo-banner" role="note">Site de démonstration – aucun SMS ni paiement réel n'est envoyé.</div>
  <header class="topbar" id="topbar">
    <a href="#/activites" class="brand" aria-label="Convivia, accueil">
      <img src="assets/convivia-icone-arrondie.svg" alt="" width="40" height="40">
      <span>Convivia</span>
    </a>
    <button class="textsize" id="textsize" type="button" aria-label="Agrandir ou réduire le texte">A<small>A</small></button>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <a href="#/activites" data-tab="activites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
      <span>Activités</span>
    </a>
    <a href="#/decouvrir" data-tab="decouvrir">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c0-3.600 2.900-6 6.500-6s6.500 2.400 6.500 6"/><path d="M16 5a3.500 3.500 0 0 1 0 7M18 14.500c2.200.8 3.500 2.700 3.500 5.500"/></svg>
      <span>Découvrir</span>
    </a>
    <a href="#/sorties" data-tab="sorties">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15.500l2 2 4-4"/></svg>
      <span>Agenda</span>
    </a>
    <a href="#/messages" data-tab="messages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.500 7.200L3 21l1.800-5.500A8 8 0 1 1 21 12z"/></svg>
      <span>Messages</span><i class="dot" id="msgdot" hidden></i>
    </a>
    <a href="#/profil" data-tab="profil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal-back" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalbox"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
