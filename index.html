<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pixel Studio — Site en pause</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #eef0f3;
    --muted: #9aa1ad;
    --accent: #d6a060;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .logo {
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  h1 {
    font-size: 22px;
    line-height: 1.4;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 24px;
    font-size: 15px;
  }
  a.contact {
    display: inline-block;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    text-decoration: none;
    font-size: 14px;
  }
  a.contact:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Pixel Studio</div>
    <h1>Le site est momentanément en pause.</h1>
    <p>Nous ne traitons pas de nouvelle commande pour l'instant. Pour toute question sur une commande en cours, contactez-nous directement.</p>
    <a class="contact" href="mailto:projets@pxlstudio.be">projets@pxlstudio.be</a>
  </div>
</body>
</html>
